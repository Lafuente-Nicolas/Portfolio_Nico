# Configuration Render (Blueprint) : New > Blueprint > choisir ce dépôt
services:
  - type: web
    name: portfolio-nico
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ReverseProxy__Enabled
        value: "true"
      - key: Smtp__Host
        value: smtp.gmail.com
      - key: Smtp__Port
        value: "587"
      # Valeurs secrètes : Render les demande à la création, elles ne sont jamais dans le code
      - key: Smtp__User
        sync: false
      - key: Smtp__From
        sync: false
      - key: Smtp__Password
        sync: false
